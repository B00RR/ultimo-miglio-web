<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Ultimo Miglio</title>
<script>
// === CONFIGURAZIONE BUILD (aggiornata da pubblica.sh) ===
var BUILD_DIR = "Build";
var LOADER_FILE = "ultimo-miglio.loader.js";
var DATA_FILE = "ultimo-miglio.data";
var FRAMEWORK_FILE = "ultimo-miglio.framework.js";
var CODE_FILE = "ultimo-miglio.wasm";
var COMPANY_NAME = "B00RR";
var PRODUCT_NAME = "Ultimo Miglio";
var PRODUCT_VERSION = "1.0";
var BUILD_SHA = "5b07b83";
// ========================================================
</script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#unity-container{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
#unity-canvas{display:block;width:100%;height:100%;background:#000;touch-action:none;outline:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#1b1b1b;color:#f6e7c8;font-family:sans-serif;z-index:5}
#loading h1{font-size:7vw;margin:0 0 4vh}
#bar{width:70vw;height:14px;border:2px solid #f6e7c8;border-radius:8px;overflow:hidden}
#fill{width:0;height:100%;background:#f6e7c8;transition:width .2s}
#pct{margin-top:1.5vh;font-size:4vw}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:#000;color:#fff;font-family:sans-serif;font-size:6vh;text-align:center;z-index:10}
#rotate span{font-size:18vh}
@media (orientation:landscape) and (max-height:600px){#rotate{display:flex}}
#err{position:fixed;left:0;right:0;bottom:0;background:#a00;color:#fff;font:14px sans-serif;padding:8px;display:none;z-index:20}
</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="loading"><h1>Ultimo Miglio</h1><div id="bar"><div id="fill"></div></div><div id="pct">0%</div></div>
<div id="rotate"><span>📱↻</span>Ruota il telefono in verticale</div>
<div id="err"></div>
<script>
(function(){
  var canvas=document.getElementById("unity-canvas");
  var fill=document.getElementById("fill"), pct=document.getElementById("pct");
  function err(m){var e=document.getElementById("err");e.style.display="block";e.textContent=m;}
  function resize(){var r=window.devicePixelRatio||1;canvas.style.width=window.innerWidth+"px";canvas.style.height=window.innerHeight+"px";}
  window.addEventListener("resize",resize);resize();
  try{ if(screen.orientation&&screen.orientation.lock){screen.orientation.lock("portrait").catch(function(){});} }catch(e){}
  document.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
  document.addEventListener("gesturestart",function(e){e.preventDefault();});
  var b=BUILD_DIR+"/";
  var V=BUILD_SHA?"?v="+BUILD_SHA:"";
  var config={
    dataUrl:b+DATA_FILE+V, frameworkUrl:b+FRAMEWORK_FILE+V, codeUrl:b+CODE_FILE+V,
    streamingAssetsUrl:"StreamingAssets",
    companyName:COMPANY_NAME, productName:PRODUCT_NAME, productVersion:PRODUCT_VERSION,
    devicePixelRatio: Math.min(window.devicePixelRatio||1, 1.25),
    matchWebGLToCanvasSize:true,
    showBanner:function(msg,type){ if(type==="error") err(msg); else console.warn(msg); }
  };
  var s=document.createElement("script");
  s.src=b+LOADER_FILE+V;
  s.onerror=function(){err("Impossibile caricare "+s.src);};
  s.onload=function(){
    createUnityInstance(canvas,config,function(p){var v=Math.round(p*100);fill.style.width=v+"%";pct.textContent=v+"%";})
    .then(function(inst){window.unityInstance=inst;document.getElementById("loading").style.display="none";})
    .catch(function(m){err("Errore: "+m);});
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
